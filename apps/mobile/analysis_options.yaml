include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # GraphQL enums use UPPER_CASE to match the server-side enum string values.
    # Renaming them would break fromJson() parsing throughout the app.
    constant_identifier_names: false

    # gql is a transitive dependency of graphql_flutter; we import it directly
    # in graphql_client.dart which is the intended usage pattern.
    depend_on_referenced_packages: false
